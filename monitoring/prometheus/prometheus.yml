global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # The application Service is a NodePort (30080) mapped to host port 8081 by
  # kind-config.yaml. Prometheus runs with host networking, so it scrapes the
  # real application Pods through the Service and sees application metrics.
  - job_name: technova-web
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels:
          environment: kind-lab
          roll: "23bcs070"
