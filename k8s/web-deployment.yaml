# ---------------------------------------------------------------------------
# TechNova web Deployment - the object Jenkins updates during a rolling
# release. The image tag is normally rendered from ansible/templates so the
# Ansible stage and a manual `kubectl apply` produce the same manifest.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technova-web
  namespace: technova
  labels:
    app: technova-web
    roll: "23bcs070"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: technova-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: technova-web
        roll: "23bcs070"
    spec:
      containers:
        - name: web
          image: technova-web-23bcs070:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              value: technova-db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: technova
            - name: DB_USER
              value: technova
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technova-db-secret
                  key: DB_PASSWORD
            - name: LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
