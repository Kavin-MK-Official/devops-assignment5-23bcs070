# NodePort 30081 is mapped to host port 8082 by kind-config.yaml.
# Changing .spec.selector.version from blue to green is the traffic switch.
apiVersion: v1
kind: Service
metadata:
  name: technova-web-bg
  namespace: technova
  labels:
    app: technova-web-bg
spec:
  type: NodePort
  selector:
    app: technova-web-bg
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
