apiVersion: apps/v1
kind: Deployment
metadata:
  name: technova-web-green
  namespace: technova
  labels:
    app: technova-web-bg
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technova-web-bg
      version: green
  template:
    metadata:
      labels:
        app: technova-web-bg
        version: green
    spec:
      containers:
        - name: web
          image: technova-web-23bcs070:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              value: technova-db-service
            - name: DB_NAME
              value: technova
            - name: DB_USER
              value: technova
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technova-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
