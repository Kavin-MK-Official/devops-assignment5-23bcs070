# ---------------------------------------------------------------------------
# Blue-green SIMULATION on a single kind cluster.
#
# Two independent Deployments (blue = 1.0.0, green = 1.1.0) run side by side.
# The Service technova-web-bg selects exactly one of them through its
# version label; the switch is a single selector patch, which is how a real
# blue-green cut-over moves traffic between two environments. Both colours
# share one cluster here, so this demonstrates the traffic switch and the
# rollback, not two physically separate environments.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technova-web-blue
  namespace: technova
  labels:
    app: technova-web-bg
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technova-web-bg
      version: blue
  template:
    metadata:
      labels:
        app: technova-web-bg
        version: blue
    spec:
      containers:
        - name: web
          image: technova-web-23bcs070:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              value: technova-db-service
            - name: DB_NAME
              value: technova
            - name: DB_USER
              value: technova
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technova-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
