# NodePort 30080 is mapped to host port 8081 by kind-config.yaml so the
# application can be reached at http://localhost:8081 on the WSL host.
apiVersion: v1
kind: Service
metadata:
  name: technova-web
  namespace: technova
  labels:
    app: technova-web
spec:
  type: NodePort
  selector:
    app: technova-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
