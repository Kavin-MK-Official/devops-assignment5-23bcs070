<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowFeedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect width="1180" height="660" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">TechNova — Assignment 5 end-to-end pipeline</text>
  <text x="40" y="74" font-size="14" fill="#475569">Roll No 23BCS070 · GitHub → Jenkins → Docker → kind/Kubernetes → Prometheus/Grafana</text>

  <!-- Stage 1: GitHub -->
  <rect x="40" y="110" width="170" height="120" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="138" font-size="12" font-weight="700" fill="#334155">STAGE 1</text>
  <text x="58" y="162" font-size="16" font-weight="700" fill="#0f172a">GitHub repository</text>
  <text x="58" y="186" font-size="12.5" fill="#475569">commit on main</text>
  <text x="58" y="205" font-size="12.5" fill="#475569">private repo + PAT</text>
  <rect x="58" y="214" width="94" height="0" fill="none"/>

  <!-- Stage 2: Jenkins -->
  <rect x="250" y="110" width="220" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="268" y="138" font-size="12" font-weight="700" fill="#1d4ed8">STAGE 2 · AUTOMATED</text>
  <text x="268" y="162" font-size="16" font-weight="700" fill="#0f172a">Jenkins CI</text>
  <text x="268" y="186" font-size="12.5" fill="#475569">checkout (Git plugin)</text>
  <text x="268" y="205" font-size="12.5" fill="#475569">pytest in python:3.12-slim</text>

  <!-- Stage 3: Docker -->
  <rect x="510" y="110" width="200" height="120" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="528" y="138" font-size="12" font-weight="700" fill="#0e7490">STAGE 3 · AUTOMATED</text>
  <text x="528" y="162" font-size="16" font-weight="700" fill="#0f172a">Docker build &amp; tag</text>
  <text x="528" y="186" font-size="12.5" fill="#475569">multi-stage Dockerfile</text>
  <text x="528" y="205" font-size="12.5" fill="#475569">technova-web-23bcs070:1.1.N</text>

  <!-- Stage 4: image delivery -->
  <rect x="750" y="110" width="190" height="120" rx="14" fill="#fefce8" stroke="#fde047"/>
  <text x="768" y="138" font-size="12" font-weight="700" fill="#a16207">STAGE 4 · AUTOMATED</text>
  <text x="768" y="162" font-size="16" font-weight="700" fill="#0f172a">Image to cluster</text>
  <text x="768" y="186" font-size="12.5" fill="#475569">kind load docker-image</text>
  <text x="768" y="205" font-size="12.5" fill="#475569">(no registry, no pull secret)</text>

  <!-- Stage 5: Kubernetes -->
  <rect x="970" y="110" width="170" height="120" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="988" y="138" font-size="12" font-weight="700" fill="#15803d">STAGE 5 · AUTOMATED</text>
  <text x="988" y="162" font-size="16" font-weight="700" fill="#0f172a">Kubernetes</text>
  <text x="988" y="186" font-size="12.5" fill="#475569">3 replicas · RollingUpdate</text>
  <text x="988" y="205" font-size="12.5" fill="#475569">NodePort 30080</text>

  <!-- Arrows top row -->
  <line x1="210" y1="170" x2="246" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="170" x2="506" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="170" x2="746" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="940" y1="170" x2="966" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ansible touchpoint -->
  <rect x="250" y="268" width="460" height="84" rx="12" fill="#fdf4ff" stroke="#e9d5ff"/>
  <text x="268" y="294" font-size="12" font-weight="700" fill="#7e22ce">STAGE 5a · CONFIG AUTOMATION (ASSIGNMENT 4 HAND-OFF)</text>
  <text x="268" y="316" font-size="12.5" fill="#0f172a">Ansible renders web-deployment.yaml from the CI image tag,</text>
  <text x="268" y="335" font-size="12.5" fill="#0f172a">then kubectl apply + rollout status</text>

  <!-- Service exposure -->
  <rect x="750" y="268" width="390" height="84" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="768" y="294" font-size="12" font-weight="700" fill="#15803d">STAGE 6 · SERVICE EXPOSURE (AUTOMATED)</text>
  <text x="768" y="316" font-size="12.5" fill="#0f172a">Service technova-web → NodePort 30080</text>
  <text x="768" y="335" font-size="12.5" fill="#0f172a">browser → http://localhost:8081</text>

  <line x1="1055" y1="230" x2="1000" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="230" x2="480" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Monitoring band -->
  <rect x="40" y="392" width="740" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="420" font-size="12" font-weight="700" fill="#334155">STAGE 7 · MONITORING AND FEEDBACK (AUTOMATED SCRAPING, MANUAL DASHBOARD READING)</text>
  <rect x="62" y="436" width="200" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="462" font-size="14" font-weight="700" fill="#0f172a">Prometheus :9090</text>
  <text x="76" y="484" font-size="12" fill="#475569">scrapes /metrics every 10 s</text>
  <text x="76" y="502" font-size="12" fill="#475569">job technova-web</text>

  <rect x="300" y="436" width="200" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="314" y="462" font-size="14" font-weight="700" fill="#0f172a">Grafana :3000</text>
  <text x="314" y="484" font-size="12" fill="#475569">provisioned datasource</text>
  <text x="314" y="502" font-size="12" fill="#475569">5 panels · 10 s refresh</text>

  <rect x="538" y="436" width="222" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="552" y="462" font-size="14" font-weight="700" fill="#0f172a">Logs</text>
  <text x="552" y="484" font-size="12" fill="#475569">kubectl logs / docker logs</text>
  <text x="552" y="502" font-size="12" fill="#475569">access log, DB warning, events</text>

  <line x1="262" y1="477" x2="296" y2="477" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowFeedback)"/>
  <line x1="500" y1="477" x2="534" y2="477" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowFeedback)"/>

  <!-- Deployment strategies -->
  <rect x="820" y="392" width="320" height="150" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="840" y="420" font-size="12" font-weight="700" fill="#c2410c">ACTIVITY 4 · DEPLOYMENT STRATEGIES</text>
  <text x="840" y="448" font-size="13.5" fill="#0f172a">Rolling: image tag change, maxUnavailable 0</text>
  <text x="840" y="472" font-size="13.5" fill="#0f172a">Blue-green: blue 1.0.0 / green 1.1.0,</text>
  <text x="840" y="494" font-size="13.5" fill="#0f172a">Service selector switch (simulation)</text>
  <text x="840" y="522" font-size="12" fill="#9a3412">Rollback: rollout undo / selector flip</text>

  <!-- Manual actions -->
  <rect x="40" y="574" width="1100" height="56" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="60" y="598" font-size="12" font-weight="700" fill="#be123c">MANUAL / OPERATOR ACTIONS</text>
  <text x="60" y="618" font-size="13" fill="#0f172a">commit &amp; push (or webhook trigger) · start the blue-green cut-over · read dashboards and act on alerts · rotate credentials and approve releases</text>

  <!-- feedback arrow -->
  <path d="M 1100 392 L 1100 360 L 1120 360" fill="none" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowFeedback)" transform="rotate(180 1100 376)"/>
</svg>
